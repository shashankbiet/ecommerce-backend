syntax="proto3";

option go_package = "github.com/shashankbiet/ecommerce-backend/search-service/proto/search";

package searchpb;

// protoc -I=proto --go_out=. --go_opt=module=github.com/shashankbiet/ecommerce-backend/search-service --go-grpc_out=require_unimplemented_servers=false:. --go-grpc_opt=module=github.com/shashankbiet/ecommerce-backend/search-service proto/**/*.proto
service SearchService{
    rpc GetProduct(ProductSearchRequest) returns (ProductSearchResponse);
}

message  ProductSearchRequest {
    string keywords = 1;
    string category = 2;
    string sub_category = 3 [json_name = "sub_category"];
}

message ProductSearchResponse {
    string keywords = 1;
    string category = 2;
    string sub_category = 3 [json_name = "sub_category"];
    uint32 total_results = 4 [json_name = "total_results"];
    repeated Product products = 5;
}

message Product{
    int64 id = 1;
    string name = 2;
    string description = 3;
    string brand = 4;
    string category = 5;
    string sub_category = 6 [json_name = "sub_category"];
    string slug = 7;
    int32 brand_id = 8 [json_name = "brand_id"];
    int32 category_id = 9 [json_name = "category_id"];
    int32 sub_category_id = 10 [json_name = "sub_category_id"];
    string image_url = 11 [json_name = "image_url"];
    int64 status = 12;
    string created_at = 13 [json_name = "created_at"];
    string updated_at = 14 [json_name = "updated_at"];
    string deleted_at = 15 [json_name = "deleted_at"];
}