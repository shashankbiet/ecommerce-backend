global:
    scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: api-gateway
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-gateway:3001"]
  - job_name: user-service
    metrics_path: "/api/user/metrics"
    static_configs:
      - targets: ["user-service:3002"]
  - job_name: inventory-service
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory-service:3003"]
  - job_name: search-service
    metrics_path: "/metrics"
    static_configs:
      - targets: ["search-service:9104"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]
