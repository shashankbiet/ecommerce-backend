version: "3.9"
services:
    api-gateway:
        build: ./api-gateway
        container_name: api-gateway
        environment:
            - APP_NAME=api-gateway
            - PORT=3001
            - ACCESS_TOKEN_SECRET=9876543210
            - USER_SERVICE_TARGET=http://user-service:3002
        ports:
            - 3001:3001
        depends_on:
            - user-service
    user-service:
        build: ./user-service
        container_name: user-service
        environment:
            - APP_NAME=user-service
            - PORT=3002
            - MONGODB_URL=mongodb://user-mongodb/userService
            - ADMIN_VERIFICATION_TOKEN=1234567890
        depends_on:
            user-mongodb:
                condition: service_healthy
    inventory-service:
        build: ./inventory-service
        container_name: inventory-service
        restart: on-failure:5
        environment:
            - APP_NAME=inventory-service
            - ENVIRONMENT=dev
            - HTTP_SERVER_PORT=3003
        ports:
            - "127.0.0.1:3003:3003"
        depends_on:
            inventory-pg:
                condition: service_healthy
            kafka:
                condition: service_healthy
    search-service:
        build: ./search-service
        container_name: search-service
        environment:
            - APP_NAME=search-service
            - ENVIRONMENT=dev
            - GRPC_SERVER_PORT=9004
        ports:
            - 9004:9004
        expose:
            - "9104"
        depends_on:
            kafka:
                condition: service_healthy
            search-es:
                condition: service_healthy
    user-mongodb:
        image: mongo:4.0.28
        container_name: user-mongodb
        restart: always
        volumes:
            - ./bind-mount/db/user-mongodb:/data/db:U
        ports:
            - 27017:27017
        healthcheck:
            test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
            interval: 30s
            timeout: 10s
            retries: 12
            start_period: 30s
    inventory-pg:
        image: postgres:16
        container_name: inventory-pg
        restart: unless-stopped
        environment:
            POSTGRES_USER: inventoryuser
            POSTGRES_PASSWORD: inventorypassword
            POSTGRES_DB: inventorydb
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U inventoryuser -d inventorydb"]
            start_period: 0s
            timeout: 10s
            interval: 1s
            retries: 10
        volumes:
            - ./bind-mount/db/inventory-pg:/var/lib/postgresql/data
        ports:
            - "5433:5432"
    search-es:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.15.1
        container_name: search-es
        environment:
            - bootstrap.memory_lock=true
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
            - discovery.type=single-node
        volumes:
            - ./bind-mount/db/search-es:/usr/share/elasticsearch/data:U
        ports:
            - "9200:9200"
            - "9300:9300"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9200"]
            interval: 30s
            timeout: 10s
            retries: 3
    zookeeper:
        image: confluentinc/cp-zookeeper:7.3.0
        hostname: zookeeper
        container_name: zookeeper
        restart: always
        environment:
            - ZOOKEEPER_CLIENT_PORT=2181
            - ZOO_TICK_TIME=2000
    kafka:
        image: confluentinc/cp-kafka:7.3.0
        hostname: kafka
        container_name: kafka
        restart: always
        ports:
            - "9092:9092"
            - "29092:29092"
            - "9999:9999"
        environment:
            - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:19092,EXTERNAL://localhost:9092,DOCKER://host.docker.internal:29092
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
            - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
            - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
            - KAFKA_BROKER_ID=1
            - KAFKA_LOG4J_LOGGERS=kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
            - KAFKA_JMX_PORT=9999
            - KAFKA_JMX_HOSTNAME=127.0.0.1
            - KAFKA_AUTHORIZER_CLASS_NAME=kafka.security.authorizer.AclAuthorizer
            - KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND=true
        healthcheck:
            test: [ "CMD", "nc", "-vz", "localhost", "9092" ]
        depends_on:
            - zookeeper
    prometheus:
        image: prom/prometheus
        container_name: prometheus
        profiles: ["monitoring"]
        restart: always
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - ./bind-mount/monitoring/prometheus:/prometheus:U
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
        ports:
            - "127.0.0.1:9090:9090"
    grafana:
        image: grafana/grafana-oss
        container_name: grafana
        profiles: ["monitoring"]
        restart: unless-stopped
        environment:
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_AUTH_ANONYMOUS_ENABLED=false
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
        volumes:
            - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
            - ./bind-mount/monitoring/grafana:/var/lib/grafana:U
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            - prometheus
    loki:
        image: grafana/loki:2.9.0
        container_name: loki
        restart: unless-stopped
        volumes:
            - ./loki-config.yaml:/mnt/config/loki-config.yaml:ro
            - ./bind-mount/monitoring/loki:/tmp/loki:U
        command:
            - --config.file=/mnt/config/loki-config.yaml
        ports:
            - "127.0.0.1:3100:3100"
    promtail:
        image: grafana/promtail:2.9.0
        container_name: promtail
        profiles: ["monitoring"]
        restart: unless-stopped
        volumes:
            - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
            - /var/log/journal:/var/log/journal:ro
            - ./bind-mount/monitoring/promtail:/var/lib/promtail:U
        command:
            - --config.file=/etc/promtail/promtail-config.yaml
        depends_on:
            - loki
